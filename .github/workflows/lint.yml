name: lint

on:
  push:
    branches:
      - main
    paths:
      - "Decay/**/*.lua"
      - ".luacheckrc"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "Decay/**/*.lua"
      - ".luacheckrc"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: |
          if [ -f .luacheckrc ]; then
            luacheck Decay --config .luacheckrc
          else
            echo ".luacheckrc not found, running with defaults"
            luacheck Decay
          fi
